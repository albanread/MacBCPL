[package]
name = "newbcpl-llvm"
version = "0.1.0"
edition = "2024"

[dependencies]
new-asm = { path = "../../new-asm" }
newbcpl-ir = { path = "../newbcpl-ir" }
newbcpl-parser = { path = "../newbcpl-parser" }
newbcpl-runtime = { path = "../newbcpl-runtime" }
newbcpl-sema = { path = "../newbcpl-sema" }
# Match NewCP's pin: Inkwell 0.9 against LLVM 22 (target-x86 family
# is what we need for x86_64-pc-windows-msvc).
inkwell = { version = "=0.9.0", default-features = false, features = ["llvm22-1"] }
# llvm-sys, inkwell's, named so that the BOX can turn off its linking
llvm-sys = { version = "=221.0.1", default-features = false }

[features]
# The BOX (design/BOX_PORT.md): MCJIT with code above 4 GB and data in the
# run's dynamic area; the runtime's RISC OS hooks
rosbox = ["newbcpl-runtime/rosbox"]
# The host check of the BOX's Intel code on an Arm Mac: LLVM's X86 backend too
x86-check = ["inkwell/target-x86"]
# The BOX: LLVM is not linked into this crate's users; /init links it once
# for every library that uses it (box/build.sh)
no-llvm-linking = ["llvm-sys/no-llvm-linking"]

# The target backend: AArch64 (macOS arm64, the BOX's Arm box); x86-64 for
# the BOX's Intel box, whose LLVM has only the X86 backend.
[target.'cfg(target_arch = "aarch64")'.dependencies]
inkwell = { version = "=0.9.0", default-features = false, features = ["llvm22-1", "target-aarch64"] }

[target.'cfg(target_arch = "x86_64")'.dependencies]
inkwell = { version = "=0.9.0", default-features = false, features = ["llvm22-1", "target-x86"] }
